<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sin conexión | Fundación Alma y Semilla</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#143627">
<link rel="icon" href="/assets/img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,600;1,9..144,300&family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bosque:#143627; --hoja:#3f6b3a; --hoja-cl:#8fb57a;
    --esmeralda:#10b981; --sol:#e9b44c; --crema:#faf6ee; --gris:#6b645b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Nunito',system-ui,sans-serif; background:var(--bosque); color:var(--crema);
    min-height:100vh; display:grid; place-items:center; text-align:center;
    padding:32px 20px; position:relative; overflow:hidden; line-height:1.65;
  }
  body::before{
    content:""; position:absolute; inset:0; opacity:.1; pointer-events:none;
    background-image:url('/assets/img/patron-tejido.svg'); background-size:140px 140px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%);
            mask-image:radial-gradient(circle at 50% 45%,#000,transparent 70%);
  }
  .envoltura{position:relative; z-index:1; max-width:580px}
  .marca{display:inline-flex; align-items:center; gap:12px; margin-bottom:34px}
  .marca img{width:44px; height:44px; border-radius:12px}
  .marca b{font-family:'Fraunces',serif; font-size:19px; font-weight:600; display:block; line-height:1.1}
  .marca small{font-size:10px; letter-spacing:.14em; text-transform:uppercase; color:rgba(250,246,238,.55); font-weight:700}
  .icono{
    width:84px; height:84px; margin:0 auto 26px; border-radius:50%;
    background:rgba(233,180,76,.1); border:1px solid rgba(233,180,76,.3);
    display:grid; place-items:center; color:var(--sol);
  }
  .icono svg{width:40px; height:40px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
  h1{font-family:'Fraunces',serif; font-size:clamp(26px,4.4vw,36px); font-weight:400; margin-bottom:16px; letter-spacing:-.01em}
  h1 em{font-style:italic; font-weight:600; color:var(--hoja-cl)}
  p{color:rgba(250,246,238,.74); font-size:17px; margin-bottom:30px}
  .acciones{display:flex; gap:14px; justify-content:center; flex-wrap:wrap}
  .btn{
    display:inline-flex; align-items:center; gap:9px; padding:14px 28px; border-radius:999px;
    font-weight:800; font-size:15px; text-decoration:none; cursor:pointer; border:2px solid transparent;
    transition:transform .25s, background .25s;
  }
  .btn--solido{background:var(--esmeralda); color:#052b1e}
  .btn--solido:hover{transform:translateY(-2px); background:#34d399}
  .btn--fantasma{background:rgba(255,255,255,.08); color:var(--crema); border-color:rgba(255,255,255,.3)}
  .btn--fantasma:hover{transform:translateY(-2px); background:var(--crema); color:var(--bosque)}
  .nota{margin-top:32px; font-size:12.5px; color:rgba(250,246,238,.4)}
</style>
</head>
<body>
  <div class="envoltura">
    <div class="marca">
      <img src="/assets/img/icon-192.png" alt="">
      <span><b>Alma y Semilla</b><small>Fundación Agro-TIC · Chía</small></span>
    </div>

    <div class="icono">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M2 12h3M19 12h3"/>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"/>
        <path d="M5 13a10 10 0 0 1 14 0"/>
        <path d="M12 20h.01"/>
      </svg>
    </div>

    <h1>El tejido sigue vivo,<br>pero <em>falta la conexión</em>.</h1>
    <p>
      No hay red en este momento. Lo que ya visitaste sigue guardado en este dispositivo:
      vuelve atrás y el contenido seguirá ahí.
    </p>

    <div class="acciones">
      <button class="btn btn--solido" onclick="location.reload()">Reintentar la conexión</button>
      <a class="btn btn--fantasma" href="/">Ir al inicio</a>
    </div>

    <p class="nota">Fundación Alma y Semilla · Chía, Cundinamarca, Colombia</p>
  </div>
</body>
</html>
